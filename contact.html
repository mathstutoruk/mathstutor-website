<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact | mathstutor.co.uk</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* YOUR ORIGINAL STYLES (UNCHANGED) */
:root{
  --navy:#041b4d;
  --navy-2:#08245e;
  --gold:#d4af37;
  --gold-soft:#e0c56a;
  --cream:#f5f3ef;
  --text:#23324e;
  --muted:#667387;
  --border:#cfc8ba;
  --white:#ffffff;
  --container:1220px;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:"Inter",sans-serif;
  background:var(--cream);
  color:var(--text);
}

a{text-decoration:none;color:inherit}

h1,h2,h3{
  font-family:"Cormorant Garamond",serif;
  font-weight:600;
  margin:0;
}

.container{
  width:min(var(--container), calc(100% - 40px));
  margin:0 auto;
}

/* HEADER */
.header{
  background:var(--navy);
  padding:22px 0;
}

.header-inner{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo img{
  width:110px;
  height:110px;
  border-radius:50%;
}

.nav{
  display:flex;
  gap:28px;
  color:white;
}

.nav-contact{
  background:linear-gradient(180deg,var(--gold-soft),var(--gold));
  color:var(--navy)!important;
  padding:10px 22px;
  border-radius:999px;
}

/* MAIN */
.contact-section{
  padding:74px 0 90px;
}

.contact-grid{
  display:grid;
  grid-template-columns:1.15fr .9fr;
  gap:80px;
}

.contact-title{
  font-size:52px;
  margin-bottom:34px;
}

.form-group{
  margin-bottom:28px;
}

input, select, textarea{
  width:100%;
  border:1px solid #b9b9b9;
  padding:14px;
  font-size:16px;
}

textarea{
  min-height:150px;
}

.submit-btn{
  border:none;
  background:linear-gradient(180deg,var(--gold-soft),var(--gold));
  color:var(--navy);
  padding:13px 28px;
  border-radius:999px;
  font-weight:700;
  cursor:pointer;
}

/* FAQ */
.faq-title{
  font-size:44px;
  margin:26px 0 70px;
}

.faq-item{
  border-top:1px solid #6f756f;
}

.faq-question{
  width:100%;
  background:none;
  border:none;
  padding:28px 0;
  display:flex;
  justify-content:space-between;
  font-size:28px;
  cursor:pointer;
}

.faq-answer{
  display:none;
  padding-bottom:20px;
}

.faq-item.open .faq-answer{
  display:block;
}

/* FOOTER */
.footer{
  background:var(--navy);
  color:white;
  text-align:center;
  padding:28px;
}
</style>
</head>

<body>

<header class="header">
  <div class="container header-inner">
    <div class="logo">
      <img src="logo-cropped.png">
    </div>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="bio.html">Bio</a>
      <a href="articles.html">Articles</a>
      <a href="contact.html" class="nav-contact">Contact</a>
    </nav>
  </div>
</header>

<main class="contact-section">
  <div class="container contact-grid">

    <!-- LEFT SIDE -->
    <section>
      <h1 class="contact-title">Get in touch to book your first lesson</h1>

      <!-- ✅ FIXED FORM -->
      <form action="https://formspree.io/f/mpqbqbww" method="POST">

        <input type="hidden" name="_subject" value="New enquiry from mathstutor.co.uk">
        <input type="hidden" name="_captcha" value="false">

        <div class="form-group">
          <input type="text" name="first_name" placeholder="First Name" required>
        </div>

        <div class="form-group">
          <input type="text" name="last_name" placeholder="Last Name" required>
        </div>

        <div class="form-group">
          <input type="email" name="email" placeholder="Email" required>
        </div>

        <div class="form-group">
          <input type="tel" name="phone" placeholder="Phone">
        </div>

        <div class="form-group">
          <select name="tuition_required">
            <option>GCSE Mathematics</option>
            <option>A-Level Mathematics</option>
            <option>Further Mathematics</option>
          </select>
        </div>

        <div class="form-group">
          <textarea name="message" placeholder="Please include the student's year group, exam board, current level and what support is needed."></textarea>
        </div>

        <button type="submit" class="submit-btn">Send Enquiry</button>
      </form>

    </section>

    <!-- RIGHT SIDE FAQ -->
    <aside>
      <h2 class="faq-title">FAQs</h2>

      <div class="faq-item">
        <button class="faq-question">Prices +</button>
        <div class="faq-answer">£80 per hour.</div>
      </div>

      <div class="faq-item">
        <button class="faq-question">Subjects +</button>
        <div class="faq-answer">GCSE & A-Level Mathematics.</div>
      </div>

      <div class="faq-item">
        <button class="faq-question">Availability +</button>
        <div class="faq-answer">Please enquire for availability.</div>
      </div>

    </aside>

  </div>
</main>

<footer class="footer">
  © mathstutor.co.uk 2026
</footer>

<script>
document.querySelectorAll(".faq-question").forEach(button => {
  button.addEventListener("click", () => {
    button.parentElement.classList.toggle("open");
  });
});
</script>

</body>
</html>
