<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact | mathstutor.co.uk</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#041b4d;
  --gold:#d4af37;
  --gold-soft:#e0c56a;
  --cream:#f5f3ef;
  --text:#23324e;
}

body{
  margin:0;
  font-family:"Inter",sans-serif;
  background:var(--cream);
  color:var(--text);
}

.container{
  width:min(1100px, calc(100% - 40px));
  margin:0 auto;
}

.header{
  background:var(--navy);
  padding:20px 0;
}

.nav{
  display:flex;
  justify-content:center;
  gap:24px;
  color:white;
}

.nav a{
  color:white;
  text-decoration:none;
}

.contact-section{
  padding:70px 0;
}

h1{
  font-family:"Cormorant Garamond",serif;
  font-size:48px;
  margin-bottom:30px;
}

.form-group{
  margin-bottom:20px;
}

input, textarea, select{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  font-size:15px;
}

button{
  background:linear-gradient(180deg,var(--gold-soft),var(--gold));
  border:none;
  padding:12px 24px;
  border-radius:999px;
  font-weight:600;
  cursor:pointer;
}
</style>
</head>

<body>

<header class="header">
  <div class="container">
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="bio.html">Bio</a>
      <a href="articles.html">Articles</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<main class="contact-section">
  <div class="container">

    <h1>Get in touch</h1>

    <!-- ✅ FORM START -->
    <form action="https://formspree.io/f/mpqbqbww" method="POST">

      <!-- Hidden fields -->
      <input type="hidden" name="_subject" value="New enquiry from mathstutor.co.uk">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_next" value="https://mathstutor.co.uk/thank-you.html">

      <div class="form-group">
        <label>First Name</label>
        <input type="text" name="first_name" required>
      </div>

      <div class="form-group">
        <label>Last Name</label>
        <input type="text" name="last_name" required>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required>
      </div>

      <div class="form-group">
        <label>Phone</label>
        <input type="tel" name="phone">
      </div>

      <div class="form-group">
        <label>Tuition Required</label>
        <select name="tuition">
          <option>GCSE Mathematics</option>
          <option>A-Level Mathematics</option>
          <option>Further Mathematics</option>
        </select>
      </div>

      <div class="form-group">
        <label>Message</label>
        <textarea name="message" placeholder="Include year group, exam board and what support is needed"></textarea>
      </div>

      <button type="submit">Send Enquiry</button>

    </form>
    <!-- ✅ FORM END -->

  </div>
</main>

</body>
</html>
