<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact | mathstutor.co.uk</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* KEEPING YOUR ORIGINAL STYLING */
:root{
  --navy:#041b4d;
  --navy-2:#08245e;
  --gold:#d4af37;
  --gold-soft:#e0c56a;
  --cream:#f5f3ef;
  --text:#23324e;
  --muted:#667387;
  --white:#ffffff;
}

body{
  margin:0;
  font-family:"Inter",sans-serif;
  background:var(--cream);
  color:var(--text);
}

.container{
  width:min(1200px, calc(100% - 40px));
  margin:0 auto;
}

.header{
  background:var(--navy);
  padding:22px 0;
}

.nav{
  display:flex;
  justify-content:center;
  gap:30px;
  color:white;
}

.nav a{
  color:white;
  text-decoration:none;
}

.contact-section{
  padding:80px 0;
}

.contact-grid{
  display:grid;
  grid-template-columns:1.2fr 1fr;
  gap:60px;
}

h1{
  font-family:"Cormorant Garamond",serif;
  font-size:52px;
  margin-bottom:30px;
}

.form-group{
  margin-bottom:22px;
}

input, select, textarea{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  font-size:15px;
}

textarea{
  min-height:140px;
}

button{
  background:linear-gradient(180deg,var(--gold-soft),var(--gold));
  border:none;
  padding:14px 28px;
  border-radius:999px;
  font-weight:600;
  cursor:pointer;
}

/* FAQ */
.faq h2{
  font-family:"Cormorant Garamond",serif;
  font-size:42px;
  margin-bottom:20px;
}

.faq-item{
  border-top:1px solid #aaa;
  padding:18px 0;
}

</style>
</head>

<body>

<header class="header">
  <div class="container">
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="bio.html">Bio</a>
      <a href="articles.html">Articles</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<main class="contact-section">
  <div class="container contact-grid">

    <!-- LEFT SIDE -->
    <div>
      <h1>Get in touch to book your first lesson</h1>

      <!-- ✅ WORKING FORM -->
      <form action="https://formspree.io/f/mpqbqbww" method="POST">

        <!-- Hidden fields -->
        <input type="hidden" name="_subject" value="New enquiry from mathstutor.co.uk">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_next" value="https://mathstutor.co.uk/thank-you.html">

        <div class="form-group">
          <input type="text" name="first_name" placeholder="First Name" required>
        </div>

        <div class="form-group">
          <input type="text" name="last_name" placeholder="Last Name" required>
        </div>

        <div class="form-group">
          <input type="email" name="email" placeholder="Email" required>
        </div>

        <div class="form-group">
          <input type="tel" name="phone" placeholder="Phone">
        </div>

        <div class="form-group">
          <select name="tuition">
            <option>GCSE Mathematics</option>
            <option>A-Level Mathematics</option>
            <option>Further Mathematics</option>
          </select>
        </div>

        <div class="form-group">
          <textarea name="message" placeholder="Include year group, exam board and what support is needed"></textarea>
        </div>

        <button type="submit">Send Enquiry</button>

      </form>
    </div>

    <!-- RIGHT SIDE FAQ -->
    <div class="faq">
      <h2>FAQs</h2>

      <div class="faq-item">
        <strong>Prices</strong>
        <p>£80 per hour for all tuition.</p>
      </div>

      <div class="faq-item">
        <strong>Subjects</strong>
        <p>GCSE and A-Level Mathematics.</p>
      </div>

      <div class="faq-item">
        <strong>Availability</strong>
        <p>Please enquire for current availability.</p>
      </div>

      <div class="faq-item">
        <strong>Online Lessons</strong>
        <p>Delivered via Zoom with digital whiteboard.</p>
      </div>

    </div>

  </div>
</main>

</body>
</html>
